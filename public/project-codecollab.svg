<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0a0a0a"/>
  <rect x="0" y="0" width="800" height="40" fill="#141414"/>
  <circle cx="20" cy="20" r="6" fill="#ff3333"/>
  <circle cx="40" cy="20" r="6" fill="#444"/>
  <circle cx="60" cy="20" r="6" fill="#444"/>
  <text x="400" y="26" fill="#888" font-family="monospace" font-size="13" text-anchor="middle">live-session.collab</text>

  <rect x="24" y="60" width="380" height="400" fill="#111111" stroke="#333" stroke-width="1"/>
  <text x="40" y="90" fill="#ff3333" font-family="monospace" font-size="14">// index.js</text>
  <g fill="#666" font-family="monospace" font-size="12">
    <text x="40" y="120">1  const io = require('socket.io')(server);</text>
    <text x="40" y="142">2  io.on('connection', socket =&gt; {</text>
    <text x="40" y="164" fill="#999">3    socket.on('code:change', d =&gt; {</text>
    <text x="40" y="186" fill="#ff3333">4      socket.broadcast.emit('code:sync', d);</text>
    <text x="40" y="208">5    });</text>
    <text x="40" y="230">6  });</text>
  </g>
  <rect x="40" y="260" width="330" height="8" fill="#222"/>
  <rect x="40" y="280" width="260" height="8" fill="#222"/>
  <rect x="40" y="300" width="300" height="8" fill="#222"/>

  <rect x="420" y="60" width="356" height="400" fill="#111111" stroke="#333" stroke-width="1"/>
  <text x="436" y="90" fill="#ff3333" font-family="monospace" font-size="14">// whiteboard.canvas</text>
  <path d="M450 300 L520 150 L600 260 L680 120 L740 220" stroke="#ff3333" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="520" cy="150" r="5" fill="#fff"/>
